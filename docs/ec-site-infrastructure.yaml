AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC Site Infrastructure with DynamoDB, ECS Fargate, S3 Object Lock, and AWS Backup Vault Lock'

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: Environment name (e.g., dev, test, prod)

  BackupS3BucketName:
    Type: String
    Default: my-immutable-backup-bucket
    Description: Name of the S3 bucket with Object Lock enabled (must be globally unique)

  NotificationEmail:
    Type: String
    Default: alert-notification@example.com
    Description: Email address for SNS topic alert notifications

  GitHubRepository:
    Type: String
    Default: my-github-user/aws-microservices-infra
    Description: GitHub Repository name (Owner/Repo) for OIDC IAM Role condition

Resources:
  # =========================================================================
  # 1. ネットワーク (VPC & Subnets)
  # =========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-public-subnet-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # 2. データベース (DynamoDB - AWS側)
  # =========================================================================
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvName}-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-inventory-table'

  SalesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvName}-sales'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sale_id
          AttributeType: S
      KeySchema:
        - AttributeName: sale_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvName}-sales-table'

  # =========================================================================
  # 3. イミュータブルバックアップ (S3 & AWS Backup)
  # =========================================================================
  # S3 Object Lock バケット (SQLダンプ等の保存用)
  BackupS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BackupS3BucketName
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 14
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # AWS Backup用ロール
  AWSBackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvName}-aws-backup-service-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  # AWS Backup Vault with Vault Lock (イミュータブルバックアップ保管庫)
  ImmutableBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub '${EnvName}-immutable-backup-vault'
      LockConfiguration:
        MinRetentionDays: 7
        MaxRetentionDays: 30
        ChangeableForDays: 3

  # AWS Backup プラン (毎日実行、14日間保持)
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        PlanName: !Sub '${EnvName}-backup-plan'
        BackupPlanRule:
          - RuleName: DailyBackupRule
            TargetBackupVault: !Ref ImmutableBackupVault
            ScheduleExpression: cron(0 15 * * ? *) # 毎日深夜0時（日本時間AM9時）
            Lifecycle:
              DeleteAfterDays: 14

  # バックアップ対象の選択 (DynamoDBテーブル)
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: DynamoDBTablesSelection
        IamRoleArn: !GetAtt AWSBackupRole.Arn
        Resources:
          - !Sub 'arn:aws:arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTable}'
          - !Sub 'arn:aws:arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SalesTable}'

  # =========================================================================
  # 4. セキュリティグループ & ALB (Application Load Balancer)
  # =========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable access only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvName}-ec-alb'
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Type: application

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvName}-ec-tg'
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

  # =========================================================================
  # 5. ECS Fargate (ECサイトモックサーバーの稼働)
  # =========================================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvName}-ec-cluster'

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvName}-ecs-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt InventoryTable.Arn
                  - !GetAtt SalesTable.Arn

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvName}-ec-app'
      RetentionInDays: 7

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvName}-ec-app'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: ec-app
          Image: node:18-alpine # 後続手順でデプロイするNodeJS簡易アプリ用
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          EntryPoint:
            - sh
            - -c
            - |
              echo "Starting EC app mockup..."
              # テスト起動確認用に簡易HTTPサーバーを立ち上げるインラインスクリプト
              cat << 'EOF' > server.js
              const http = require('http');
              const server = http.createServer((req, res) => {
                if (req.url === '/health') {
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ status: 'healthy' }));
                } else {
                  res.writeHead(200, { 'Content-Type': 'text/plain' });
                  res.end('EC Site Backend Service - AWS Live');
                }
              });
              server.listen(3000, () => console.log('Listening on port 3000'));
              EOF
              node server.js
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ec-app

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref ECSTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: ec-app
          ContainerPort: 3000
          TargetGroupArn: !Ref ALBTargetGroup

  # =========================================================================
  # 6. アラート通知 (SNS)
  # =========================================================================
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvName}-ec-alarms'
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

Outputs:
  ALBDNSName:
    Description: DNS name of the ALB to access the EC site
    Value: !GetAtt ALB.DNSName

  InventoryTableName:
    Description: Name of the Inventory table in DynamoDB
    Value: !Ref InventoryTable

  SalesTableName:
    Description: Name of the Sales table in DynamoDB
    Value: !Ref SalesTable

  ImmutableBackupVaultName:
    Description: Name of the Vault Lock enabled AWS Backup Vault
    Value: !Ref ImmutableBackupVault
